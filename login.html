<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login to Airtel Lite</title>

<style>
body {
    margin: 0;
    background: #f6f7fb;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 420px;
    margin: auto;
    padding: 40px 20px;
    text-align: center;
}

.card {
    background: white;
    padding: 30px 20px;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

h2 {
    margin-bottom: 25px;
}

input {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #ccc;
    font-size: 16px;
    margin-bottom: 20px;
}

button {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    background: #ffb3b3;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:disabled {
    background: #ddd;
}

.link {
    margin-top: 15px;
    color: #1a73e8;
    font-size: 14px;
}

.or {
    margin: 20px 0;
    color: gray;
}

.alt {
    border: 2px solid #1a73e8;
    background: white;
    color: #1a73e8;
    padding: 12px;
    border-radius: 10px;
    font-weight: bold;
}

.countdown {
    margin-top: 15px;
    color: gray;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="container">
    <div class="card">

        <h2>LOGIN TO AIRTEL LITE</h2>

        <input type="tel" placeholder="+260 XXXXXXXXX">

        <button id="otpBtn" onclick="sendOTP()">SEND OTP</button>

        <div class="countdown" id="countdown"></div>

        <div class="link">Forgot your number? <b>Click Here!</b></div>

        <div class="or">OR</div>

        <div class="alt">CONTINUE WITHOUT LOGIN</div>
    </div>
</div>

<script>
function sendOTP() {
    const btn = document.getElementById("otpBtn");
    const countdown = document.getElementById("countdown");

    btn.disabled = true;
    let timeLeft = 5;

    countdown.innerText = "Redirecting in " + timeLeft + " seconds...";

    const timer = setInterval(() => {
        timeLeft--;
        countdown.innerText = "Redirecting in " + timeLeft + " seconds...";

        if (timeLeft <= 0) {
            clearInterval(timer);
            window.location.href = "otp.html"; // next page
        }
    }, 1000);
}
</script>

</body>
</html>
